name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (lint + types + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check agloom

      - name: Ruff format check
        run: uv run ruff format --check agloom

      - name: Pyrefly typecheck
        run: uv run pyrefly check agloom

      - name: Pytest
        run: uv run pytest -q

  agloom_cli:
    name: agloom-cli (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agloom_cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  agloom_web:
    name: agloom-web (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agloom_web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
